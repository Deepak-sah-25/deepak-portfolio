<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <defs>
    <linearGradient id="kg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="orangeG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#kg)" rx="12"/>
  <circle cx="200" cy="95" r="75" fill="#f97316" opacity="0.14" filter="url(#glow)"/>
  
  <!-- Modern Shopping Bag Icon -->
  <g transform="translate(182, 36) scale(0.9)">
    <rect x="-18" y="4" width="72" height="60" rx="10" fill="url(#orangeG)" />
    <path d="M-2,4 C-2,-14 38,-14 38,4" fill="none" stroke="#fed7aa" stroke-width="5.5" stroke-linecap="round"/>
    <!-- Bag stitch line -->
    <line x1="-8" y1="20" x2="44" y2="20" stroke="#ffffff" stroke-width="2" stroke-dasharray="4,3" opacity="0.6"/>
    <!-- Star sparkle -->
    <path d="M18,34 L21,41 L28,42 L23,47 L24,54 L18,50 L12,54 L13,47 L8,42 L15,41 Z" fill="#ffffff" opacity="0.95"/>
  </g>

  <!-- Typography -->
  <text x="200" y="132" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="32" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">
    kinaun<tspan fill="#f97316">.com</tspan>
  </text>
  <text x="200" y="156" font-family="'Mukta', 'Inter', system-ui, sans-serif" font-weight="600" font-size="12.5" fill="#fed7aa" text-anchor="middle" letter-spacing="2">
    किनौं • ONLINE SHOPPING NEPAL
  </text>
  <rect x="140" y="168" width="120" height="3" rx="1.5" fill="url(#orangeG)"/>
</svg>
